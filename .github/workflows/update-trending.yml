name: Update Trending Repositories

# Run daily at 11:00 IST (IST = UTC+5:30 -> 11:00 IST = 05:30 UTC)
permissions:
  contents: write
concurrency:
  group: update-trending
  cancel-in-progress: true

on:
  schedule:
    - cron: '30 5 * * *'  # daily at 05:30 UTC -> 11:00 IST
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update trending list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREND_DAYS: '7'    # change to 1/30 etc. to control timeframe
          RESULTS: '20'      # number of repos to fetch
          LANGUAGE: ''       # optional, e.g. 'python' to filter by language
        run: python scripts/update_trending.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update trending repositories section" || echo "No changes to commit"
          git push
